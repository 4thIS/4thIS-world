# 실행: cp .env.example .env (값 채우기) → docker compose up -d → http://localhost:8080
name: 4this-world

services:
  world:
    build: .
    image: 4this-world
    ports:
      - '8080:8080'
    env_file: .env
    volumes:
      - world-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  world-data:
